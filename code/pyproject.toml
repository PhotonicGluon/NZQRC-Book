[tool.poetry]
name = "nzqrc-code"
version = "0.1.0"
description = "Companion code for the book."
authors = ["PhotonicGluon <25820201+PhotonicGluon@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "image_generation" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"

typer = "^0.12.5"
pillow = "^10.4.0"

[tool.poetry.group.imgen]
optional = true

[tool.poetry.group.imgen.dependencies]
manim = "~0.18.1"
jupyter = "^1.1.1"
notebook = "^7.2.2"

[tool.poetry.group.qr]
optional = true

[tool.poetry.group.qr.dependencies]
qrcode = {extras = ["pil"], version = "^8.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
