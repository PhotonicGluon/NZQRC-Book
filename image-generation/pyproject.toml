[tool.poetry]
name = "nzqrc-img-gen"
version = "0.1.0"
description = "Code that generates (most of) the images in the book."
authors = ["PhotonicGluon <25820201+PhotonicGluon@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"

[tool.poetry.group.main.dependencies]
typer = "^0.12.5"
pillow = "^10.4.0"

[tool.poetry.group.manim.dependencies]
manim = "~0.18.1"
jupyter = "^1.1.1"
notebook = "^7.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
